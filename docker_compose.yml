version: '3.8'

services:
  cpu_stress:
    image: alexeiled/stress-ng
    command: --cpu 2 --timeout 60s
    deploy:
      resources:
        limits:
          cpus: '0.50'

  memory_stress:
    image: alexeiled/stress-ng
    command: --vm 1 --vm-bytes 300M --timeout 60s
    deploy:
      resources:
        limits:
          memory: 128M

  io_stress:
    image: alexeiled/stress-ng
    command: --io 2 --timeout 60s